apiVersion: apps/v1
kind: Deployment
metadata:
  name: logguard-web
  labels:
    app: logguard-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: logguard-web
  template:
    metadata:
      labels:
        app: logguard-web
    spec:
      containers:
        - name: web
          image: DOCKER_USERNAME_PLACEHOLDER/logguard-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: logguard-web-service
  labels:
    app: logguard-web
spec:
  type: NodePort
  selector:
    app: logguard-web
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30090